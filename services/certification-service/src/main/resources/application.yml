spring:
  application:
    name: certification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5443/somlits_dev_certification_db}
    username: ${DB_USERNAME:somlits_dev}
    password: ${DB_PASSWORD:localdev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/somlits}

server:
  port: ${SERVER_PORT:8089}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /internal/v1/api-docs
  swagger-ui:
    path: /internal/v1/swagger-ui
