spring:
  application:
    name: market-trade-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/somlits_dev_market_trade_db}
    username: ${DB_USERNAME:somlits_dev}
    password: ${DB_PASSWORD:localdev_only}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/somlits}

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,diskSpace

info:
  app:
    name: ${spring.application.name}
    version: "0.1.0-SNAPSHOT"
    environment: ${SOMLITS_ENV:local}

springdoc:
  api-docs:
    path: /internal/v1/api-docs
  swagger-ui:
    path: /internal/v1/swagger-ui
