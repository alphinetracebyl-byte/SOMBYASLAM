spring:
  datasource:
    url: jdbc:tc:postgresql:16:///somlits_audit_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/realms/somlits

somlits:
  services:
    animal-registry:   http://localhost:8081
    movement-tracking: http://localhost:8083
    vet-health:        http://localhost:8085
    market-trade:      http://localhost:8086
    quarantine-export: http://localhost:8087
    abattoir:          http://localhost:8088
