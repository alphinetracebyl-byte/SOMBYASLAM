spring:
  datasource:
    url: jdbc:h2:mem:movement_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/test-realm

somlits:
  servicebus:
    connection-string: Endpoint=sb://test;SharedAccessKeyName=test;SharedAccessKey=dGVzdA==;
    topic: test.movement-tracking
  outbox:
    relay:
      batch-size: 10
      poll-interval-ms: 999999999
