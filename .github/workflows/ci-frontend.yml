name: CI — Frontend Platforms

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - 'platforms/**'
      - 'libs/design-tokens/**'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'platforms/**'
      - 'libs/design-tokens/**'

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [farmer, field, ministry]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter "platforms/${{ matrix.platform }}" type-check

      - name: Lint (ESLint)
        run: pnpm --filter "platforms/${{ matrix.platform }}" lint

      - name: Format check (Prettier)
        run: pnpm --filter "platforms/${{ matrix.platform }}" format:check

      - name: Unit tests (Vitest)
        run: pnpm --filter "platforms/${{ matrix.platform }}" test:coverage

      - name: Build (Vite)
        run: pnpm --filter "platforms/${{ matrix.platform }}" build
        env:
          VITE_API_BASE_URL: https://api-dev.somlits.gov.so/v1
          VITE_KEYCLOAK_URL: https://auth-dev.somlits.gov.so
          VITE_KEYCLOAK_REALM: somlits
          VITE_KEYCLOAK_CLIENT_ID: somlits-${{ matrix.platform }}-dev
          VITE_ENV: dev

      - name: Bundle size check
        run: pnpm --filter "platforms/${{ matrix.platform }}" bundlesize

      - name: Lighthouse CI
        if: matrix.platform != 'ministry'
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: platforms/${{ matrix.platform }}/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: platforms/${{ matrix.platform }}/dist
          retention-days: 7
